# CiLiCiLi：nginx 直接托管 Flutter Web 静态文件，/api 反代到 Docker 容器（127.0.0.1:8080）。
# 证书路径按实际替换。

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /opt/libretv/cert.pem;
    ssl_certificate_key /opt/libretv/key.pem;

    client_max_body_size 20m;

    # Web 体积较大（Flutter Web），gzip_static 直接发预压缩文件。
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm font/ttf font/otf image/svg+xml application/octet-stream;

    root /opt/cilicili/web;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /flutter.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
